<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniLink - Direct Messaging</title>
  
  <!-- Font Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-page: #f8fafc;
      --bg-card: #ffffff;
      --border-light: #e2e8f0;
      --border-focus: #2563eb;
      
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-subtle: #94a3b8;
      
      --primary: #1d4ed8;
      --primary-hover: #1e40af;
      --primary-light: #eff6ff;
      --primary-border: #bfdbfe;
      
      --badge-sec-bg: #eff6ff;
      --badge-sec-text: #1d4ed8;
      
      --badge-common-bg: #e0e7ff;
      --badge-common-text: #3730a3;
      
      --badge-green-bg: #dcfce7;
      --badge-green-text: #15803d;

      --badge-teal-bg: #ccfbf1;
      --badge-teal-text: #0f766e;

      --badge-gray-bg: #f1f5f9;
      --badge-gray-text: #475569;

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --radius-xl: 18px;

      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-card: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      font-size: 13px;
      line-height: 1.4;
      height: 100vh;
      overflow: hidden;
    }

    .app-layout {
      display: flex;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    .sidebar {
      width: 210px;
      background-color: var(--bg-card);
      border-right: 1px solid var(--border-light);
      padding: 20px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex-shrink: 0;
      height: 100vh;
    }

    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 8px 12px 8px;
    }

    .brand-logo-icon {
      width: 28px;
      height: 28px;
      background-color: var(--primary);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-weight: 800;
      font-size: 13px;
      letter-spacing: -0.5px;
    }

    .brand-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.3px;
    }

    .nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 12px;
    }

    .nav-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px;
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.15s ease;
    }

    .nav-link-content {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-link:hover {
      background-color: #f1f5f9;
      color: var(--text-main);
    }

    .nav-link.active {
      background-color: var(--primary-light);
      color: var(--primary);
      font-weight: 700;
    }

    .nav-badge-core {
      background-color: var(--badge-green-bg);
      color: var(--badge-green-text);
      font-size: 9px;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 4px;
    }

    .nav-badge-count {
      background-color: var(--primary);
      color: #ffffff;
      font-size: 10px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 10px;
    }

    .sidebar-footer {
      border-top: 1px solid var(--border-light);
      padding-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .sidebar-footer-link {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 12.5px;
      font-weight: 500;
      border-radius: var(--radius-sm);
    }

    .sidebar-footer-link:hover {
      color: var(--text-main);
      background-color: #f8fafc;
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      height: 100vh;
      overflow: hidden;
    }

    .top-header {
      background-color: var(--bg-card);
      border-bottom: 1px solid var(--border-light);
      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .global-search {
      position: relative;
      width: 440px;
    }

    .global-search input {
      width: 100%;
      background-color: #f1f5f9;
      border: 1px solid transparent;
      padding: 8px 14px 8px 34px;
      border-radius: 20px;
      font-size: 12.5px;
      color: var(--text-main);
      outline: none;
      transition: all 0.2s ease;
    }

    .global-search input:focus {
      background-color: #ffffff;
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .global-search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-subtle);
      font-size: 13px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .btn-share-resource {
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      padding: 7px 16px;
      border-radius: 18px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .btn-share-resource:hover {
      background-color: var(--primary-hover);
    }

    .nav-bell-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      position: relative;
      padding: 4px;
      font-size: 15px;
    }

    .bell-dot {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 6px;
      height: 6px;
      background-color: #ef4444;
      border-radius: 50%;
      border: 1px solid #ffffff;
    }

    .user-profile-widget {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-left: 8px;
    }

    .user-avatar-img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
    }

    .user-details {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
    }

    .user-name-text {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-main);
    }

    .user-uni-text {
      font-size: 10.5px;
      color: var(--text-muted);
    }

    .messaging-wrapper {
      display: flex;
      flex-direction: column;
      flex: 1;
      height: calc(100vh - 53px);
      overflow: hidden;
    }

    .page-sub-header {
      padding: 16px 24px 12px 24px;
      background-color: #ffffff;
      border-bottom: 1px solid var(--border-light);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .header-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .category-pill {
      font-size: 9.5px;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: 0.6px;
      text-transform: uppercase;
    }

    .page-title {
      font-size: 20px;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.3px;
    }

    .page-desc {
      font-size: 11.5px;
      color: var(--text-muted);
    }

    .header-btns {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-circles {
      background-color: #f1f5f9;
      color: var(--text-main);
      border: 1px solid var(--border-light);
      padding: 7px 12px;
      border-radius: var(--radius-sm);
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-new-msg {
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      padding: 7px 14px;
      border-radius: var(--radius-sm);
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .messaging-body {
      display: grid;
      grid-template-columns: 340px 1fr;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    .conversations-panel {
      background-color: #ffffff;
      border-right: 1px solid var(--border-light);
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
    }

    .conv-search-box {
      padding: 12px 14px 8px 14px;
    }

    .conv-search-input-wrap {
      position: relative;
    }

    .conv-search-input-wrap input {
      width: 100%;
      background-color: #f8fafc;
      border: 1px solid var(--border-light);
      padding: 7px 12px 7px 30px;
      border-radius: var(--radius-sm);
      font-size: 11.5px;
      color: var(--text-main);
      outline: none;
    }

    .conv-search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-subtle);
      font-size: 11px;
    }

    .conv-filter-tabs {
      padding: 4px 14px 10px 14px;
      display: flex;
      gap: 6px;
      border-bottom: 1px solid var(--border-light);
    }

    .filter-tab {
      background-color: #f1f5f9;
      color: var(--text-muted);
      border: none;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .filter-tab.active {
      background-color: #dbeafe;
      color: var(--primary);
    }

    .encrypted-bar {
      padding: 8px 14px;
      background-color: #f8fafc;
      border-bottom: 1px solid var(--border-light);
      font-size: 10px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
    }

    .conversation-list {
      overflow-y: auto;
      flex: 1;
      list-style: none;
    }

    .conv-item {
      padding: 12px 14px;
      border-bottom: 1px solid #f1f5f9;
      cursor: pointer;
      display: flex;
      gap: 10px;
      transition: background-color 0.15s ease;
      position: relative;
    }

    .conv-item:hover {
      background-color: #f8fafc;
    }

    .conv-item.active {
      background-color: var(--primary-light);
      border-left: 3px solid var(--primary);
    }

    .avatar-wrapper {
      position: relative;
      flex-shrink: 0;
    }

    .conv-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
    }

    .online-indicator {
      width: 10px;
      height: 10px;
      background-color: #22c55e;
      border: 2px solid #ffffff;
      border-radius: 50%;
      position: absolute;
      bottom: 0;
      right: 0;
    }

    .conv-details {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .conv-top-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .conv-name {
      font-size: 12.5px;
      font-weight: 800;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .conv-time {
      font-size: 10px;
      color: var(--text-subtle);
    }

    .conv-badges {
      display: flex;
      gap: 4px;
      margin: 1px 0;
      flex-wrap: wrap;
    }

    .badge-pill-micro {
      background-color: var(--badge-sec-bg);
      color: var(--badge-sec-text);
      font-size: 8.5px;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 3px;
    }

    .badge-pill-micro-gray {
      background-color: #e2e8f0;
      color: var(--text-muted);
      font-size: 8.5px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 3px;
    }

    .conv-preview-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    .conv-preview {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .unread-count-dot {
      background-color: var(--primary);
      color: #ffffff;
      font-size: 9.5px;
      font-weight: 800;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .chat-window {
      display: flex;
      flex-direction: column;
      background-color: #f8fafc;
      height: 100%;
      min-height: 0;
      overflow: hidden;
    }

    .chat-header {
      background-color: #ffffff;
      border-bottom: 1px solid var(--border-light);
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .chat-user-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .chat-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
    }

    .chat-title-group {
      display: flex;
      flex-direction: column;
    }

    .chat-name-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chat-user-name {
      font-size: 14px;
      font-weight: 800;
      color: var(--text-main);
    }

    .match-tag-pill {
      background-color: var(--badge-teal-bg);
      color: var(--badge-teal-text);
      font-size: 9.5px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 10px;
    }

    .chat-user-sub {
      font-size: 11px;
      color: var(--text-muted);
    }

    .chat-header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-header-outline {
      background-color: #ffffff;
      border: 1px solid var(--border-light);
      color: var(--text-main);
      padding: 5px 10px;
      border-radius: var(--radius-sm);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .btn-header-outline:hover {
      background-color: #f8fafc;
    }

    .icon-btn {
      background: none;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-sm);
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      cursor: pointer;
    }

    .icon-btn:hover {
      background-color: #f1f5f9;
      color: var(--text-main);
    }

    /* Chat Messages Body */
    .chat-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 0;
    }

    .date-separator {
      text-align: center;
      position: relative;
      margin: 4px 0;
    }

    .date-separator::before {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      width: 100%;
      height: 1px;
      background-color: var(--border-light);
      z-index: 1;
    }

    .date-separator span {
      background-color: #f8fafc;
      position: relative;
      z-index: 2;
      padding: 0 12px;
      font-size: 10.5px;
      font-weight: 700;
      color: var(--text-subtle);
    }

    .system-banner {
      background-color: #eff6ff;
      border: 1px solid #dbeafe;
      border-radius: var(--radius-md);
      padding: 10px 14px;
      font-size: 11px;
      color: #1e40af;
      display: flex;
      align-items: center;
      gap: 8px;
      line-height: 1.35;
    }

    .msg-group {
      display: flex;
      gap: 10px;
      max-width: 78%;
    }

    .msg-group.incoming {
      align-self: flex-start;
    }

    .msg-group.outgoing {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .msg-sender-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: cover;
      margin-top: 2px;
    }

    .msg-content-block {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .msg-bubble {
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 12px;
      line-height: 1.45;
      position: relative;
      box-shadow: var(--shadow-sm);
    }

    .msg-group.incoming .msg-bubble {
      background-color: #ffffff;
      color: var(--text-main);
      border: 1px solid var(--border-light);
      border-top-left-radius: 2px;
    }

    .msg-group.outgoing .msg-bubble {
      background-color: #1e40af;
      color: #ffffff;
      border-top-right-radius: 2px;
    }

    .msg-time-status {
      font-size: 9.5px;
      color: var(--text-subtle);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .msg-group.outgoing .msg-time-status {
      align-self: flex-end;
    }

    /* Interactive Invite Card */
    .invite-widget-card {
      background-color: #ffffff;
      border: 1px solid var(--border-light);
      border-left: 4px solid var(--primary);
      border-radius: var(--radius-md);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 4px;
      box-shadow: var(--shadow-sm);
      width: 320px;
    }

    .invite-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .invite-title {
      font-size: 12px;
      font-weight: 800;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .invite-status-badge {
      font-size: 8.5px;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 4px;
    }

    .invite-status-badge.pending {
      background-color: #fef3c7;
      color: #d97706;
    }

    .invite-status-badge.accepted {
      background-color: var(--badge-green-bg);
      color: var(--badge-green-text);
    }

    .invite-details-box {
      font-size: 11px;
      color: var(--text-muted);
      background-color: #f8fafc;
      padding: 6px 8px;
      border-radius: var(--radius-sm);
    }

    .invite-btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn-invite-action {
      padding: 6px;
      border-radius: var(--radius-sm);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      border: 1px solid var(--border-light);
      background-color: #ffffff;
      color: var(--text-main);
      transition: all 0.15s ease;
    }

    .btn-invite-action.primary {
      background-color: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .btn-invite-action.primary:hover {
      background-color: var(--primary-hover);
    }

    .chat-footer {
      background-color: #ffffff;
      border-top: 1px solid var(--border-light);
      padding: 10px 20px 12px 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }

    .quick-pills-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .quick-pill-btn {
      background-color: #f1f5f9;
      color: var(--text-muted);
      border: 1px solid var(--border-light);
      padding: 4px 10px;
      border-radius: 14px;
      font-size: 10.5px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .quick-pill-btn:hover {
      background-color: var(--primary-light);
      color: var(--primary);
      border-color: var(--primary-border);
    }

    .input-box-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      background-color: #f8fafc;
      border: 1px solid var(--border-light);
      border-radius: 20px;
      padding: 4px 6px 4px 12px;
      transition: all 0.2s ease;
    }

    .input-box-wrapper:focus-within {
      background-color: #ffffff;
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .input-action-btn {
      background: none;
      border: none;
      color: var(--text-subtle);
      cursor: pointer;
      font-size: 14px;
      padding: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .input-action-btn:hover {
      color: var(--text-main);
    }

    .chat-text-input {
      flex: 1;
      border: none;
      background: transparent;
