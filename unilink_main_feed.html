<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniLink - NSU Student Dashboard</title>
  
  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-page: #f8fafc;
      --bg-card: #ffffff;
      --border-light: #e2e8f0;
      --border-focus: #2563eb;
      
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-subtle: #94a3b8;
      
      --primary: #1d4ed8;
      --primary-hover: #1e40af;
      --primary-light: #eff6ff;
      --primary-border: #bfdbfe;

      --badge-sec-bg: #eff6ff;
      --badge-sec-text: #1d4ed8;
      
      --badge-green-bg: #dcfce7;
      --badge-green-text: #15803d;

      --badge-teal-bg: #ccfbf1;
      --badge-teal-text: #0f766e;

      --badge-amber-bg: #fef3c7;
      --badge-amber-text: #b45309;

      --badge-purple-bg: #f3e8ff;
      --badge-purple-text: #6b21a8;

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;

      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-card: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      font-size: 13px;
      line-height: 1.4;
      min-height: 100vh;
    }

    /* Layout Structure */
    .app-layout {
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar Navigation */
    .sidebar {
      width: 230px;
      background-color: var(--bg-card);
      border-right: 1px solid var(--border-light);
      padding: 20px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex-shrink: 0;
      position: sticky;
      top: 0;
      height: 100vh;
      z-index: 30;
    }

    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 8px 16px 8px;
    }

    .brand-logo-icon {
      width: 28px;
      height: 28px;
      background-color: var(--primary);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-weight: 800;
      font-size: 13px;
      letter-spacing: -0.5px;
    }

    .brand-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.3px;
    }

    .nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 8px;
    }

    .nav-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px;
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.15s ease;
    }

    .nav-link-content {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-link:hover {
      background-color: #f1f5f9;
      color: var(--text-main);
    }

    .nav-link.active {
      background-color: var(--primary-light);
      color: var(--primary);
      font-weight: 700;
    }

    .badge-core {
      background-color: #dbeafe;
      color: var(--primary);
      font-size: 9.5px;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 4px;
      letter-spacing: 0.3px;
    }

    .sidebar-footer {
      border-top: 1px solid var(--border-light);
      padding-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .sidebar-footer-link {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 12.5px;
      font-weight: 500;
      border-radius: var(--radius-sm);
    }

    .sidebar-footer-link:hover {
      color: var(--text-main);
      background-color: #f8fafc;
    }

    /* Main Area */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    /* Top Header */
    .top-header {
      background-color: var(--bg-card);
      border-bottom: 1px solid var(--border-light);
      padding: 10px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .global-search {
      position: relative;
      width: 440px;
    }

    .global-search input {
      width: 100%;
      background-color: #f1f5f9;
      border: 1px solid transparent;
      padding: 8px 50px 8px 34px;
      border-radius: 20px;
      font-size: 12.5px;
      color: var(--text-main);
      outline: none;
      transition: all 0.2s;
    }

    .global-search input:focus {
      background-color: #ffffff;
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .global-search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-subtle);
      font-size: 13px;
    }

    .kbd-shortcut {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background-color: #e2e8f0;
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .btn-share-resource {
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      padding: 8px 16px;
      border-radius: 18px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-share-resource:hover {
      background-color: var(--primary-hover);
    }

    .nav-bell-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      position: relative;
      padding: 6px;
      font-size: 16px;
      border-radius: 50%;
    }

    .nav-bell-btn:hover {
      background-color: #f1f5f9;
    }

    .bell-dot {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 7px;
      height: 7px;
      background-color: #ef4444;
      border-radius: 50%;
      border: 1.5px solid #ffffff;
    }

    .user-profile-widget {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-left: 8px;
    }

    .user-avatar-img {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      object-fit: cover;
    }

    .user-details {
      display: flex;
      flex-direction: column;
      line-height: 1.25;
    }

    .user-name-text {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-main);
    }

    .user-uni-text {
      font-size: 10.5px;
      color: var(--text-muted);
    }

    /* Page Container */
    .page-container {
      padding: 20px 28px 32px 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    /* Top Alert Banner */
    .urgent-alert-banner {
      background-color: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: var(--radius-md);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .alert-left-content {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #991b1b;
      font-size: 12px;
    }

    .alert-badge {
      background-color: #ef4444;
      color: #ffffff;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }

    .alert-right-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-alert-details {
      background-color: #ffffff;
      border: 1px solid #fca5a5;
      color: #991b1b;
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-alert-details:hover {
      background-color: #fff5f5;
    }

    .btn-alert-close {
      background: none;
      border: none;
      color: #991b1b;
      font-size: 14px;
      cursor: pointer;
      line-height: 1;
    }

    /* Greeting Header Row */
    .greeting-header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
    }

    .greeting-title-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .greeting-title-flex {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .greeting-title-flex h1 {
      font-size: 22px;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.4px;
    }

    .sem-pill-badge {
      background-color: var(--primary-light);
      color: var(--primary);
      border: 1px solid var(--primary-border);
      font-size: 10.5px;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 12px;
      letter-spacing: 0.2px;
    }

    .greeting-subtext {
      font-size: 12.5px;
      color: var(--text-muted);
    }

    .stats-pills-group {
      display: flex;
      gap: 8px;
    }

    .stat-pill-btn {
      background-color: var(--bg-card);
      border: 1px solid var(--border-light);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-main);
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .stat-pill-btn:hover {
      border-color: var(--border-focus);
      color: var(--primary);
    }

    /* Action Shortcut Grid (4 Cards) */
    .action-shortcuts-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }

    .shortcut-card {
      border-radius: var(--radius-md);
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
      position: relative;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: var(--shadow-sm);
    }

    .shortcut-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-card);
    }

    /* Card 1 Variant */
    .shortcut-card.blue-gradient {
      background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
      color: #ffffff;
    }

    /* Card 2 Variant */
    .shortcut-card.indigo-purple {
      background: linear-gradient(135deg, #4c1d95 0%, #312e81 100%);
      color: #ffffff;
    }

    /* Card 3 Variant */
    .shortcut-card.light-blue-outline {
      background-color: var(--bg-card);
      border: 1px solid var(--primary-border);
      color: var(--text-main);
    }

    /* Card 4 Variant */
    .shortcut-card.light-green-outline {
      background-color: var(--bg-card);
      border: 1px solid #bbf7d0;
      color: var(--text-main);
    }

    .card-top-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .card-top-icon {
      font-size: 20px;
    }

    .shortcut-badge {
      font-size: 9.5px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 4px;
      letter-spacing: 0.3px;
    }

    .badge-white-trans {
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
    }

    .badge-matched-blue {
      background-color: #dbeafe;
      color: #1d4ed8;
    }

    .badge-active-green {
      background-color: #dcfce7;
      color: #15803d;
    }

    .card-body-text {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .card-body-text h3 {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.2px;
    }

    .card-body-text p {
      font-size: 11px;
      line-height: 1.4;
      opacity: 0.9;
    }

    .light-blue-outline .card-body-text p,
    .light-green-outline .card-body-text p {
      color: var(--text-muted);
      opacity: 1;
    }

    .card-cta-btn {
      font-size: 11.5px;
      font-weight: 800;
      background: none;
      border: none;
      cursor: pointer;
      text-align: left;
      padding: 0;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .blue-gradient .card-cta-btn,
    .indigo-purple .card-cta-btn {
      color: #ffffff;
    }

    .light-blue-outline .card-cta-btn {
      color: var(--primary);
    }

    .light-green-outline .card-cta-btn {
      color: #15803d;
    }

    /* Section Headers */
    .section-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
    }

    .section-title-flex {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title-flex h2 {
      font-size: 16px;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.2px;
    }

    .link-view-all {
      color: var(--primary);
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
    }

    .link-view-all:hover {
      text-decoration: underline;
    }

    /* Recommended Cards Grid (2 Columns) */
    .recommended-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .recommended-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: var(--shadow-sm);
    }

    .rec-badge-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .pill-course-code {
      background-color: #dbeafe;
      color: #1e40af;
      font-size: 9.5px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 4px;
    }

    .pill-faculty-rev {
      background-color: #dcfce7;
      color: #15803d;
      font-size: 9.5px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 4px;
    }

    .pill-peer-ver {
      background-color: #f3e8ff;
      color: #6b21a8;
      font-size: 9.5px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 4px;
    }

    .rec-card-title {
      font-size: 13.5px;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1.35;
    }

    .rec-meta-info {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .rating-star {
      color: #d97706;
      font-weight: 700;
    }

    .uploader-text {
      font-size: 11px;
      color: var(--text-subtle);
    }

    .rec-card-actions {
      display: flex;
      gap: 8px;
      margin-top: 2px;
    }

    .btn-rec-preview {
      background-color: #ffffff;
      border: 1px solid var(--border-light);
      color: var(--text-main);
      padding: 6px 14px;
      border-radius: var(--radius-sm);
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-rec-download {
      background-color: var(--primary);
      border: 1px solid var(--primary);
      color: #ffffff;
      padding: 6px 14px;
      border-radius: var(--radius-sm);
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-rec-preview:hover {
      background-color: #f8fafc;
    }

    .btn-rec-download:hover {
      background-color: var(--primary-hover);
    }

    /* Main Content Grid (Feed + Right Sidebar) */
    .feed-sidebar-grid {
      display: grid;
      grid-template-columns: 1fr 310px;
      gap: 20px;
      align-items: start;
    }

    /* Left Feed Area */
    .feed-column {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .feed-tabs-row {
      display: flex;
      border-bottom: 1px solid var(--border-light);
      gap: 24px;
    }

    .feed-tab-btn {
      background: none;
      border: none;
      padding: 8px 0;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      position: relative;
    }

    .feed-tab-btn.active {
      color: var(--primary);
    }

    .feed-tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      right: 0;
      height: 2px;
      background-color: var(--primary);
    }

    /* Feed Items */
    .feed-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: var(--shadow-sm);
      border-left: 4px solid #cbd5e1;
    }

    /* Colored Left Border Accents */
    .feed-card.accent-academic { border-left-color: var(--primary); }
    .feed-card.accent-official { border-left-color: #16a34a; }
    .feed-card.accent-club { border-left-color: #9333ea; }
    .feed-card.accent-job { border-left-color: #e11d48; }
    .feed-card.accent-partner { border-left-color: #0d9488; }

    .feed-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .author-info-flex {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .author-avatar-img {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
    }

    .author-name-group {
      display: flex;
      flex-direction: column;
    }

    .author-name-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .author-name {
      font-size: 13px;
      font-weight: 800;
      color: var(--text-main);
    }

    .badge-top-peer {
      background-color: #dbeafe;
      color: #1d4ed8;
      font-size: 9px;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 4px;
    }

    .badge-official {
      background-color: #dcfce7;
      color: #15803d;
      font-size: 9px;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 4px;
    }

    .post-time {
      font-size: 10.5px;
      color: var(--text-subtle);
    }

    .tag-feed-type {
      font-size: 10px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 4px;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }

    .tag-academic { background-color: #eff6ff; color: #1d4ed8; }
    .tag-official { background-color: #f0fdf4; color: #16a34a; }
    .tag-club { background-color: #faf5ff; color: #9333ea; }
    .tag-job { background-color: #fff1f2; color: #e11d48; }
    .tag-partner { background-color: #f0fdfa; color: #0d9488; }

    .feed-card-title {
      font-size: 14px;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1.35;
    }

    .post-text-p {
      font-size: 12px;
      color: #334155;
      line-height: 1.5;
    }

    .post-hashtags-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .hashtag-pill {
      color: var(--primary);
      background-color: #f1f5f9;
      font-size: 10.5px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
    }

    /* Embedded Highlight Boxes inside cards */
    .post-resource-embed {
      background-color: #f8fafc;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .embed-file-info {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .file-icon-pdf {
      background-color: #fef2f2;
      color: #dc2626;
      font-weight: 800;
      font-size: 10px;
      padding: 4px 6px;
      border-radius: 4px;
    }

    .embed-text-flex {
      display: flex;
      flex-direction: column;
    }

    .embed-filename {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-main);
    }

    .embed-filesize {
      font-size: 10px;
      color: var(--text-muted);
    }
